<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>随想笔记</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root{
    --bg:#F1F2F6; --panel:#FFFFFF; --panel-2:#F7F8FA;
    --line:#E4E6EB; --line-soft:#EFF1F4;
    --title:#2C3440; --text:#797E85; --muted:#A0A3A8;
    --accent:#5B6BE8; --accent-soft:rgba(91,107,232,.10);
    --ai:#7C5BE8; --ai-soft:rgba(124,91,232,.10);
    --danger:#FF3B30; --ok:#34C759; --warn:#FF9500;
    --radius:14px;
    --safe-top:var(--ai-phone-app-safe-top, 0px);
    --safe-bottom:var(--ai-phone-app-safe-bottom, 12px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--bg); color:var(--title);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; height:100%;
  }
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
  input,textarea,select{font:inherit; color:inherit;}

  /* ── 顶栏 ── */
  .qn-head{padding:calc(var(--safe-top) + 10px) 14px 8px; background:linear-gradient(180deg,#FFFFFF 0%,#F7F8FB 100%); border-bottom:1px solid var(--line-soft);}
  .qn-head-row{display:flex; align-items:center; gap:10px;}
  .qn-title{font-size:19px; font-weight:700; letter-spacing:.3px; display:flex; align-items:center; gap:7px;}
  .qn-title .dot{width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .qn-seg{margin-left:auto; display:inline-flex; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:2px;}
  .qn-seg button{padding:4px 12px; border-radius:8px; font-size:12.5px; color:var(--text); font-weight:600;}
  .qn-seg button[data-on="1"]{background:var(--panel); color:var(--title); box-shadow:0 1px 2px rgba(44,52,64,.08);}
  .qn-stat{margin-top:7px; font-size:11px; color:var(--muted);}
  .qn-search{margin-top:9px; display:flex; align-items:center; gap:7px; background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:7px 10px;}
  .qn-search svg{flex:none; opacity:.45;}
  .qn-search input{flex:1; min-width:0; border:none; outline:none; background:transparent; font-size:13.5px;}
  .qn-search input::placeholder{color:var(--muted);}
  .qn-chips{margin-top:9px; display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
  .qn-chips::-webkit-scrollbar{display:none;}
  .qn-chip{flex:none; padding:5px 11px; border-radius:999px; font-size:12.5px; color:var(--text); background:var(--panel); border:1px solid var(--line); white-space:nowrap;}
  .qn-chip[data-active="1"]{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  .qn-chip .n{opacity:.6; margin-left:4px; font-size:11px;}
  .qn-chip[data-active="1"] .n{opacity:.85;}
  .qn-toolbar{margin-top:9px; display:flex; gap:8px; align-items:center;}
  .qn-btn{display:inline-flex; align-items:center; gap:5px; justify-content:center; padding:7px 12px; border-radius:10px; font-size:12.5px; font-weight:600; background:var(--panel); border:1px solid var(--line); color:var(--title);}
  .qn-btn:active{transform:scale(.98);}
  .qn-btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .qn-btn.ai{background:var(--ai-soft); border-color:rgba(124,91,232,.28); color:var(--ai);}
  .qn-btn.ghost{background:transparent; border-color:transparent; color:var(--text);}
  .qn-btn.danger{color:var(--danger); border-color:rgba(255,59,48,.28);}
  .qn-btn[disabled]{opacity:.45;}
  .qn-btn.grow{flex:1;}
  .qn-sort{margin-left:auto; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:4px;}
  .qn-sort select{border:none; background:transparent; color:var(--text); font-size:12px; outline:none;}

  /* ── 列表 ── */
  .qn-body{flex:1; overflow:auto; padding:12px 14px calc(var(--safe-bottom) + 84px); -webkit-overflow-scrolling:touch;}
  .qn-card{background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--radius); padding:12px 13px; margin-bottom:10px; box-shadow:0 1px 2px rgba(44,52,64,.03);}
  .qn-card:active{background:var(--panel-2);}
  .qn-card-batch{cursor:pointer; user-select:none;}
  .qn-card-checkbox{width:18px; height:18px; margin-right:6px; flex-shrink:0; cursor:pointer;}
  .qn-card-top{display:flex; align-items:flex-start; gap:8px;}
  .qn-card-title{font-size:14.5px; font-weight:650; line-height:1.35; flex:1; word-break:break-word;}
  .qn-card-title .pin{color:var(--warn); margin-right:3px;}
  .qn-badge{flex:none; font-size:10.5px; padding:2px 7px; border-radius:6px; font-weight:600; background:var(--accent-soft); color:var(--accent); white-space:nowrap;}
  .qn-badge.inbox{background:rgba(255,149,0,.12); color:var(--warn);}
  .qn-badge.dim{background:rgba(121,126,133,.10); color:var(--text);}
  .qn-badge.ai{background:var(--ai-soft); color:var(--ai);}
  .qn-card-preview{margin-top:6px; font-size:12.5px; color:var(--text); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word; white-space:pre-wrap;}
  .qn-card-summary{margin-top:6px; font-size:12px; color:var(--ai); background:var(--ai-soft); border-radius:8px; padding:5px 9px; line-height:1.5;}
  .qn-card-foot{margin-top:8px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:11px; color:var(--muted);}
  .qn-tag{font-size:10.5px; padding:1.5px 7px; border-radius:5px; background:var(--panel-2); border:1px solid var(--line-soft); color:var(--text);}
  .qn-meta{margin-left:auto; white-space:nowrap;}
  .qn-empty{text-align:center; color:var(--muted); padding:48px 20px; font-size:13px; line-height:1.9;}
  .qn-empty b{display:block; color:var(--title); font-size:15px; margin-bottom:6px;}
  .qn-hintbar{font-size:11.5px; color:var(--text); background:#FFF9EC; border:1px solid #F5E3BE; border-radius:10px; padding:8px 11px; margin-bottom:10px; line-height:1.6;}
  .qn-busy{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ai); padding:8px 2px;}
  .spin{width:13px; height:13px; border:2px solid var(--ai-soft); border-top-color:var(--ai); border-radius:50%; animation:qnSpin .7s linear infinite; flex:none;}
  @keyframes qnSpin{to{transform:rotate(360deg);}}

  /* ── 时间线视图 ─ */
  .qn-timeline-section{margin-bottom:18px; transition:background .3s;}
  .qn-timeline-header{font-size:13px; font-weight:700; color:var(--accent); margin-bottom:10px; padding-left:4px; display:flex; align-items:center; gap:6px; user-select:none;}
  .qn-timeline-header:hover{opacity:.85;}
  .qn-timeline-items{position:relative; padding-left:20px; overflow:hidden;}
  .qn-timeline-items::before{content:""; position:absolute; left:6px; top:0; bottom:0; width:2px; background:linear-gradient(180deg, var(--accent-soft) 0%, transparent 100%); border-radius:1px;}
  .qn-timeline-card{position:relative; margin-bottom:12px; background:var(--panel); border:1px solid var(--line-soft); border-radius:12px; padding:11px 12px; box-shadow:0 1px 2px rgba(44,52,64,.03); cursor:pointer; transition:.15s;}
  .qn-timeline-card:active{background:var(--panel-2); transform:scale(.99);}
  .qn-timeline-card::before{content:""; position:absolute; left:-17px; top:14px; width:8px; height:8px; border-radius:50%; background:var(--accent); border:2px solid var(--bg); box-shadow:0 0 0 2px var(--accent-soft);}
  .qn-timeline-date{font-size:11px; color:var(--muted); margin-bottom:5px;}
  .qn-timeline-title{font-size:14px; font-weight:650; margin-bottom:5px; word-break:break-word;}
  .qn-timeline-badges{display:flex; gap:5px; flex-wrap:wrap; margin-bottom:5px;}
  .qn-timeline-preview{font-size:12px; color:var(--text); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word;}

  /* ── 回顾视图 ─ */
  .qn-review-header{font-size:16px; font-weight:700; color:var(--title); margin-bottom:8px;}
  .qn-review-section{font-size:13px; font-weight:650; color:var(--accent); margin-bottom:8px; padding-left:4px;}
  .qn-stat-card{background:var(--panel); border:1px solid var(--line-soft); border-radius:12px; padding:14px 10px; text-align:center; box-shadow:0 1px 2px rgba(44,52,64,.03);}
  .qn-stat-num{font-size:24px; font-weight:700; color:var(--accent); margin-bottom:4px;}
  .qn-stat-label{font-size:11px; color:var(--muted);}

  /* ── 底部主操作 ── */
  .qn-foot{position:fixed; left:0; right:0; bottom:0; z-index:20; padding:10px 14px calc(var(--safe-bottom) + 8px); background:linear-gradient(180deg,rgba(241,242,246,0) 0%,var(--bg) 42%); display:flex; gap:8px;}

  /* ── 抽屉 ── */
  .qn-sheet{position:fixed; inset:0; z-index:40; display:none;}
  .qn-sheet[data-open="1"]{display:block;}
  .qn-mask{position:absolute; inset:0; background:rgba(28,32,40,.34);}
  .qn-panel{position:absolute; left:0; right:0; bottom:0; max-height:94%; background:var(--bg); border-radius:20px 20px 0 0; overflow:hidden; display:flex; flex-direction:column; animation:qnUp .22s ease; box-shadow:0 -8px 30px rgba(28,32,40,.18);}
  @keyframes qnUp{from{transform:translateY(24px); opacity:.4;} to{transform:translateY(0); opacity:1;}}
  .qn-sheet-head{padding:24px 14px 10px; background:var(--panel); border-bottom:1px solid var(--line-soft); display:flex; align-items:center; gap:9px;}
  .qn-sheet-title{font-size:15.5px; font-weight:700;}
  .qn-sheet-sub{font-size:11.5px; color:var(--muted);}
  .qn-sheet-body{flex:1; overflow:auto; padding:14px; -webkit-overflow-scrolling:touch;}
  .qn-sheet-foot{padding:10px 14px calc(var(--safe-bottom) + 10px); background:var(--panel); border-top:1px solid var(--line-soft); display:flex; gap:8px; flex-wrap:wrap;}
  .qn-close{margin-left:auto; width:30px; height:30px; border-radius:50%; background:var(--panel-2); color:var(--text); font-size:15px; line-height:1;}
  .qn-field{margin-bottom:13px;}
  .qn-label{font-size:12px; color:var(--text); margin-bottom:5px; display:flex; align-items:center; gap:6px;}
  .qn-input,.qn-textarea,.qn-select{width:100%; background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:9px 11px; outline:none; font-size:13.5px; color:var(--title);}
  .qn-input:focus,.qn-textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .qn-textarea{min-height:150px; resize:vertical; line-height:1.6; font-family:inherit;}
  .qn-textarea.tall{min-height:220px;}
  .qn-row{display:flex; gap:8px;}
  .qn-row>*{flex:1; min-width:0;}
  .qn-charcard{display:flex; align-items:center; gap:10px; padding:10px 11px; border:1px solid var(--line-soft); background:var(--panel); border-radius:12px; margin-bottom:8px;}
  .qn-charcard[data-active="1"]{border-color:var(--ai); background:var(--ai-soft);}
  .qn-charcard .av{width:34px; height:34px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; flex:none; overflow:hidden;}
  .qn-charcard .av img{width:100%; height:100%; object-fit:cover;}
  .qn-charcard .nm{font-size:13.5px; font-weight:600; word-break:break-word;}
  .qn-charcard .ds{font-size:11px; color:var(--muted); margin-top:2px; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;}
  .qn-chiprow{display:flex; gap:6px; flex-wrap:wrap;}
  .qn-chiprow .pk{padding:5px 10px; border-radius:8px; font-size:12px; background:var(--panel-2); border:1px solid var(--line); color:var(--text);}
  .qn-chiprow .pk[data-on="1"]{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  .qn-aibox{background:var(--ai-soft); border:1px solid rgba(124,91,232,.22); border-radius:12px; padding:11px 12px; font-size:13px; line-height:1.65; color:#4a3f7a; white-space:pre-wrap; word-break:break-word; max-height:320px; overflow:auto;}
  .qn-aibox .who{font-size:11px; color:var(--ai); font-weight:700; margin-bottom:5px;}
  .qn-md{font-size:13px;}
  .qn-md h4{margin:10px 0 5px; font-size:13.5px;}
  .qn-md p{margin:5px 0;}
  .qn-md li{margin:3px 0 3px 2px;}

  /* ── 应用内弹窗 ── */
  .qn-dialog{position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center; padding:24px;}
  .qn-dialog[data-open="1"]{display:flex;}
  .qn-dialog-mask{position:absolute; inset:0; background:rgba(24,28,36,.42);}
  .qn-dialog-box{position:relative; width:100%; max-width:340px; background:var(--panel); border-radius:16px; padding:18px 16px 14px; box-shadow:0 16px 40px rgba(20,24,32,.28); animation:qnUp .18s ease;}
  .qn-dialog-title{font-size:15px; font-weight:700; margin-bottom:6px;}
  .qn-dialog-text{font-size:13px; color:var(--text); line-height:1.6; white-space:pre-wrap; word-break:break-word; max-height:300px; overflow:auto;}
  .qn-dialog-copy{width:100%; margin-top:9px; height:96px; border:1px solid var(--line); border-radius:10px; padding:8px; font-size:12px; resize:none; background:var(--panel-2);}
  .qn-dialog-actions{margin-top:14px; display:flex; gap:8px;}
  .qn-dialog-actions .qn-btn{flex:1;}

  .qn-toast{position:fixed; left:50%; bottom:calc(var(--safe-bottom) + 96px); transform:translate(-50%,10px); background:rgba(30,34,42,.92); color:#fff; font-size:12.5px; padding:8px 15px; border-radius:999px; opacity:0; pointer-events:none; transition:.2s; z-index:90; max-width:78%; text-align:center;}
  .qn-toast[data-show="1"]{opacity:1; transform:translate(-50%,0);}

  /* ── 附件区域 ── */
  .qn-attachments{margin-top:10px; border:1px dashed var(--line); border-radius:10px; padding:10px; background:var(--panel-2);}
  .qn-attach-list{display:flex; flex-direction:column; gap:6px; margin-top:6px;}
  .qn-attach-item{display:flex; align-items:center; gap:8px; padding:7px 9px; background:var(--panel); border:1px solid var(--line-soft); border-radius:8px; font-size:12px;}
  .qn-attach-icon{width:28px; height:28px; border-radius:6px; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:14px; flex:none;}
  .qn-attach-info{flex:1; min-width:0; overflow:hidden;}
  .qn-attach-name{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .qn-attach-size{font-size:11px; color:var(--muted); margin-top:1px;}
  .qn-attach-del{width:24px; height:24px; border-radius:50%; background:rgba(255,59,48,.08); color:var(--danger); font-size:13px; display:flex; align-items:center; justify-content:center;}
  .qn-attach-del:hover{background:rgba(255,59,48,.18);}
  .qn-upload-btn{display:inline-flex; align-items:center; gap:5px; padding:6px 11px; border-radius:8px; font-size:12px; background:var(--panel); border:1px solid var(--line); color:var(--text); cursor:pointer;}
  .qn-upload-btn:hover{border-color:var(--accent); color:var(--accent);}
  .qn-upload-input{display:none;}
  .qn-analyze-switch{margin-top:8px; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text);}
  .qn-toggle{position:relative; width:40px; height:22px; background:var(--line); border-radius:11px; cursor:pointer; transition:.2s;}
  .qn-toggle[data-on="1"]{background:var(--accent);}
  .qn-toggle::after{content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 2px rgba(0,0,0,.12);}
  .qn-toggle[data-on="1"]::after{transform:translateX(18px);}

  /* ── 分类下拉菜单 ── */
  .qn-cat-dropdown{position:absolute; top:100%; left:0; right:0; z-index:30; background:var(--panel); border:1px solid var(--line); border-radius:10px; margin-top:4px; box-shadow:0 4px 12px rgba(0,0,0,.1); max-height:200px; overflow-y:auto;}
  .qn-cat-item{padding:9px 12px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:8px; transition:.15s;}
  .qn-cat-item:hover{background:var(--accent-soft); color:var(--accent);}
  .qn-cat-item .qn-cat-match{font-weight:600;}
  .qn-cat-item .qn-cat-hint{font-size:11px; color:var(--muted); margin-left:auto;}
  .qn-cat-item.new-cat{border-top:1px solid var(--line-soft); color:var(--accent);}
  .qn-cat-item.new-cat::before{content:"+"; font-weight:700; margin-right:4px;}

  /* ── 新顶部栏 ── */
  .qn-topbar{position:sticky; top:0; z-index:10; background:rgba(241,242,246,.95); backdrop-filter:blur(10px); padding:10px 14px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line-soft);}
  .qn-search-box{flex:1; display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:7px 10px; transition:.2s;}
  .qn-search-box:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .qn-search-box input{flex:1; border:none; outline:none; background:transparent; font-size:13px; color:var(--title);}
  .qn-search-icon{color:var(--muted); flex-shrink:0;}
  .qn-topbar-actions{display:flex; gap:6px;}
  .qn-btn-icon{width:38px; height:38px; border-radius:10px; background:var(--panel); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--text); cursor:pointer; transition:.2s;}
  .qn-btn-icon:active{transform:scale(.95);}
  .qn-btn-icon.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .qn-btn-icon.primary:active{opacity:.9;}

  /* ── 筛选区 ── */
  .qn-filters{padding:12px 14px; background:var(--bg); border-bottom:1px solid var(--line-soft);}
  .qn-stat{font-size:11px; color:var(--muted); margin-bottom:8px;}
  .qn-toolbar{display:flex; gap:8px; align-items:center; margin-top:9px;}
  .qn-sort{margin-left:auto; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:4px;}
  .qn-sort select{border:none; background:transparent; color:var(--text); font-size:12px; outline:none;}
</style>
</head>
<body>

<header class="qn-head">
  <div class="qn-head-row">
    <div class="qn-title"><span class="dot"></span>随想笔记</div>
    <div class="qn-seg">
      <button id="qnTabNotes" data-on="1">想法</button>
      <button id="qnTabTimeline" data-on="0">时间线</button>
      <button id="qnTabReview" data-on="0">回顾</button>
      <button id="qnTabAnas" data-on="0">分析</button>
    </div>
  </div>
  <div class="qn-stat" id="qnStat"></div>
  <div class="qn-search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="qnSearch" placeholder="搜索标题 / 正文 / 标签" />
  </div>
  <div class="qn-chips" id="qnChips"></div>
  <div class="qn-toolbar">
    <button class="qn-btn ai" id="qnAiAll">AI 批量处理</button>
    <button class="qn-btn" id="qnRefresh">刷新</button>
    <div class="qn-sort">
      <span>排序</span>
      <select id="qnSort">
        <option value="updated">最近更新</option>
        <option value="created">创建时间</option>
        <option value="title">标题</option>
      </select>
    </div>
  </div>
</header>

<!-- 批量操作栏 -->
<div id="qnBatchBar" style="display:none; padding:8px 12px; background:var(--bg); border-bottom:1px solid var(--border);">
  <div style="display:flex; align-items:center; gap:8px;">
    <label style="font-size:13px; color:var(--muted); display:flex; align-items:center; gap:4px; cursor:pointer;">
      <input type="checkbox" id="qnBatchSelectAll" style="width:16px; height:16px;" />
      <span>全选</span>
    </label>
    <span id="qnBatchCount" style="font-size:12px; color:var(--muted); margin-left:auto;"></span>
    <button class="qn-btn primary" id="qnBatchExport" style="padding:4px 12px; font-size:12px;">🗜️ 批量导出ZIP</button>
    <button class="qn-btn" id="qnBatchCancel" style="padding:4px 12px; font-size:12px;">取消</button>
  </div>
</div>

<main class="qn-body" id="qnList"></main>

<footer class="qn-foot">
  <button class="qn-btn primary grow" id="qnNew">＋ 记一条想法</button>
  <button class="qn-btn ai" id="qnNewTpl" title="使用模板">📋</button>

要求：

示例输出：

  /* ── 读取文件为文本 ─ */
  function readFileAsText(file) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();

      reader.onerror = function() { reject(reader.error); };

  var AI = (typeof window.AiPhone !== "undefined" && window.AiPhone) || null;

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

    if (t < 86400000) return Math.floor(t / 3600000) + " 小时前";

  /* ── 双向链接处理 ─ */
  
  // 从文本中提取 [[笔记标题]] 或 [[笔记ID]] 引用
  function extractLinks(text) {
    if (!text) return [];
    var matches = text.match(/\[\[([^\]]+)\]\]/g);
    if (!matches) return [];
    
    var links = [];
    matches.forEach(function(m) {
      var content = m.slice(2, -2).trim(); // 去掉 [[ 和 ]]
      if (content) links.push(content);
    });
    return links;
  }
  
  // 根据标题或ID查找笔记
  function findNoteByTitleOrId(query) {
    // 先尝试匹配ID
    var byId = store.notes.filter(function(n) { return n.id === query; })[0];
    if (byId) return byId;
    
    // 再尝试匹配标题（不区分大小写）
    var q = query.toLowerCase();
    return store.notes.filter(function(n) { 
      return n.title && n.title.toLowerCase().indexOf(q) >= 0; 
    })[0];
  }
  
  // 解析文本中的链接，返回链接对象数组
  function parseLinks(text) {
    if (!text) return [];
    var refs = extractLinks(text);
    var links = [];
    
    refs.forEach(function(ref) {
      var note = findNoteByTitleOrId(ref);
      if (note) {
        links.push({
          id: note.id,
          title: note.title || "未命名",
          refText: ref // 原始引用文本
        });
      }
    });
    
    return links;
  }

  function updateNoteLinks(note) {

    var ext = '.' + (name.split('.').pop() || '').toLowerCase();
    return ['.png', '.jpg', '.jpeg'].indexOf(ext) >= 0;
  }

  function canAnalyzeFile(name) {
    return isTextFile(name) || isImageFile(name);

  function readFileAsBase64(file) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onload = function() { resolve(reader.result); };
      reader.onerror = function() { reject(reader.error); };
      reader.readAsDataURL(file);
    });
  }

  function readFileAsText(file) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onload = function() { resolve(reader.result); };
      reader.onerror = function() { reject(reader.error); };
      reader.readAsText(file);
    });
  }

      else { c.value = ""; c.style.display = "none"; }
      var cancel = $("qnDialogCancel");

      else { cancel.style.display = ""; cancel.textContent = o.cancelText || "取消"; }
      var ok = $("qnDialogOk");

      ok.className = "qn-btn " + (o.danger ? "danger" : "primary");
      $("qnDialog").setAttribute("data-open", "1");

  }

  function copyText(text) {
    return new Promise(function (resolve) {
      var done = false;
      try {
        var ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.left = "-9999px";
        document.body.appendChild(ta); ta.focus(); ta.select();
        done = document.execCommand("copy");
        document.body.removeChild(ta);
      } catch (e) { done = false; }
      if (done) { toast("已复制"); resolve(true); }
      else { _openDialog({ title: "手动复制", message: "当前环境不让应用直接写剪贴板。文本已选中，长按 / 右键复制即可。", copyText: text, okText: "关闭", cancelText: null }); resolve(false); }
    });
  }

  /* ══════════════════════════════════════════════════════
     2. AI 调用封装（全部走宿主桥接，失败一律 catch 成 null）
     ══════════════════════════════════════════════════════ */
  function aiChat(system, user, opts) {
    if (!canChat) return Promise.reject(new Error("当前没有可用的 AI（缺少 ai.chat 权限或未配置模型）"));
    opts = opts || {};
    // 注意：宿主在 messages 非空时不会单独读取 system 字段，必须把 system 放进 messages 里。
    return AI.ai.chat({
      messages: [
        { role: "system", content: system },
        { role: "user", content: user }
      ],
      temperature: (opts.temperature != null ? opts.temperature : 0.4),
      maxTokens: opts.maxTokens || 900
    }).then(function (r) {
      var text = (r && (r.text || r.content)) || "";
      if (!text) throw new Error("AI 没有返回内容");
      return text;
    });
  }
  function aiGenerate(characterId, instruction, body, extraOpts) {
    if (!canGen) return Promise.reject(new Error("当前没有可用的 AI（缺少 ai.generate 权限）"));
    // 注意：宿主只在 input 为对象时才拼进提示词，字符串正文必须并进 instruction。
    var full = String(instruction || "") + (body ? "\n\n" + body : "");
    var payload = { characterId: characterId, instruction: full, historyLimit: 6 };
    if (extraOpts && typeof extraOpts === "object") {
      if (Array.isArray(extraOpts.worldBookIds) && extraOpts.worldBookIds.length) payload.worldBookIds = extraOpts.worldBookIds;
      if (extraOpts.activateAllWorldBooks === true) payload.activateAllWorldBooks = true;
    }
    return AI.ai.generate(payload).then(function (r) {
      var text = (r && (r.text || r.content)) || "";
      if (!text) throw new Error("角色没有返回内容");
      return text;
    });
  }
  function aiClassify(text, labels) {
    if (!canClassify) return Promise.resolve("");
    return AI.ai.classify({ text: text, labels: labels, categories: labels }).then(function (r) {
      return (r && r.label) ? String(r.label) : "";
    }).catch(function () { return ""; });
  }
  function parseJsonLoose(text) {
    var t = String(text || "").trim();
    t = t.replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
    var m = t.match(/\{[\s\S]*\}/);
    if (m) t = m[0];
    try { return JSON.parse(t); } catch (e) { return null; }
  }

  var SYS_ORGANIZE = "你是笔记整理助手。阅读用户的一条想法，输出严格的 JSON（不要任何解释、不要代码块围栏）：\n{\"category\":\"分类\",\"tags\":[\"标签1\",\"标签2\"],\"summary\":\"一句话摘要\"}\n规则：category 必须从用户给出的分类清单里选一个；tags 给 2~5 个简短中文/英文关键词；summary 用一句话概括这条想法的核心，不超过 40 字。";
  var SYS_BATCH = "你是我的开发想法整理助手。下面是我近期随手记录的一批零散想法。请把它们归纳成一份清晰的清单：先按主题分组（每组一个主题小标题 + 该组要点），再在最后给一句整体观察（我最近在想什么、有哪些趋势或风险）。用简体中文，可用 Markdown 小标题与短横线列表，不要客套话。";

  function organizeNote(note) {
    var user = "分类清单：" + store.cats.join("、") + "\n\n想法标题：" + titleOf(note) + "\n想法正文：\n" + (note.text || "(无正文)");

    return aiChat(SYS_ORGANIZE, user, { temperature: 0.2, maxTokens: 500 }).then(function (out) {
      var obj = parseJsonLoose(out);
      if (obj && typeof obj === "object") {
        var cat = String(obj.category || "").trim();
        var tags = Array.isArray(obj.tags) ? obj.tags.map(String).filter(Boolean).slice(0, 6) : [];
        var summary = String(obj.summary || "").trim();
        if (cat && store.cats.length && store.cats.indexOf(cat) < 0) {
          // 模型给了清单外的分类，保留但记下
        }
        return { category: cat, tags: tags, summary: summary };
      }
      // 退化：JSON 解析失败时，退到 classify 做分类，摘要用原文本截断
      return aiClassify(note.text || titleOf(note), store.cats).then(function (label) {
        return { category: label || "", tags: [], summary: String(out || "").replace(/\s+/g, " ").slice(0, 40) };
      });
    });
  }

  function extractAttachmentText(att) {
    return new Promise(function(resolve, reject) {
      if (isTextFile(att.name)) {
        // txt/md 文件：从 dataUrl 解码为文本
        try {
          var base64 = att.dataUrl.split(',')[1];
          var binary = atob(base64);
          var bytes = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }
          var decoder = new TextDecoder('utf-8');
          var text = decoder.decode(bytes);
          resolve(text.slice(0, 5000)); // 限制长度避免 token 爆炸
        } catch(e) {
          reject(e);
        }
      } else if (isImageFile(att.name)) {
        // 图片：当前环境不做 OCR，只告知存在该图片附件，不谎称读取内容
        resolve("【图片附件：" + att.name + "（" + formatFileSize(att.size || 0) + "）】这是一张图片，当前环境未开启图片识别，无法读取其中的文字或画面内容。");
      } else {
        reject(new Error("不支持的文件类型"));
      }
    });
  }

  /* ── 时间线视图渲染 ─ */
  
  // 按时间分组笔记
  function groupNotesByDate(notes) {
    var groups = {
      today: [],
      yesterday: [],
      thisWeek: [],
      thisMonth: [],
      earlier: []
    };
    
    var now = new Date();
    var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    var yesterdayStart = todayStart - 86400000;
    var weekStart = todayStart - (now.getDay() * 86400000);
    var monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
    
    notes.forEach(function(n) {
      // 根据 store.timelineGroupBy 决定使用哪个时间字段
      var timeStr = store.timelineGroupBy === "created" ? n.createdAt : n.updatedAt;
      var noteTime = new Date(timeStr).getTime();
      if (isNaN(noteTime)) {
        groups.earlier.push(n);
        return;
      }
      
      if (noteTime >= todayStart) {
        groups.today.push(n);
      } else if (noteTime >= yesterdayStart) {
        groups.yesterday.push(n);
      } else if (noteTime >= weekStart) {
        groups.thisWeek.push(n);
      } else if (noteTime >= monthStart) {
        groups.thisMonth.push(n);
      } else {
        groups.earlier.push(n);
      }
    });
    
    return groups;
  }
  
  // 渲染日历热力图（最近30天）
  function renderHeatmap(notes) {
    var timeField = store.timelineGroupBy === "created" ? "createdAt" : "updatedAt";
    
    // 统计每天的笔记数量
    var dateCounts = {};
    notes.forEach(function(n) {
      var dateStr = n[timeField].slice(0, 10); // YYYY-MM-DD
      dateCounts[dateStr] = (dateCounts[dateStr] || 0) + 1;
    });
    
    // 生成最近30天的日期数组
    var days = [];
    var now = new Date();
    for (var i = 29; i >= 0; i--) {
      var d = new Date(now.getTime() - i * 86400000);
      var dateStr = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0') + "-" + String(d.getDate()).padStart(2, '0');
      days.push({
        date: dateStr,
        count: dateCounts[dateStr] || 0,
        day: d.getDate(),
        month: d.getMonth() + 1
      });
    }
    
    // 计算最大数量用于颜色映射
    var maxCount = 0;
    days.forEach(function(d) { if (d.count > maxCount) maxCount = d.count; });
    
    // 生成热力图HTML
    var html = '<div style="margin-bottom:14px;">';
    html += '<div style="font-size:11px; color:var(--muted); margin-bottom:6px;">最近30天笔记分布（点击日期跳转）</div>';
    html += '<div style="display:flex; flex-wrap:wrap; gap:3px;">';
    
    days.forEach(function(d) {
      var intensity = d.count === 0 ? 0 : Math.min(1, d.count / Math.max(maxCount, 1));
      var bgColor = getHeatColor(intensity);
      var textColor = intensity > 0.5 ? '#fff' : 'var(--text)';
      
      html += '<div style="width:18px; height:18px; border-radius:3px; background:' + bgColor + '; color:' + textColor + '; display:flex; align-items:center; justify-content:center; font-size:9px; cursor:pointer; transition:.15s;" title="' + d.date + ' (' + d.count + '条)" data-heatmap-date="' + d.date + '" onmouseover="this.style.transform=\'scale(1.2)\'; this.style.zIndex=\'10\'" onmouseout="this.style.transform=\'\'; this.style.zIndex=\'\'">' + d.day + '</div>';
    });
    
    html += '</div></div>';
    return html;
  }
  
  // 获取热力图颜色（从浅到深）
  function getHeatColor(intensity) {
    if (intensity === 0) return 'var(--panel-2)';
    // 使用主题色的不同透明度
    var alpha = 0.1 + intensity * 0.7; // 0.1 ~ 0.8
    return 'rgba(91,107,232,' + alpha.toFixed(2) + ')';
  }
  
  // 格式化日期标签

      datePick.onkeydown = function(e) {

          handleDateJump(this);
        }
      };
      
      // 失去焦点时也尝试跳转（如果输入了有效日期）
      datePick.onblur = function() {
        handleDateJump(this);
      };
    }
    
    // 绑定热力图日期点击事件
    var heatmapCells = document.querySelectorAll("[data-heatmap-date]");
    heatmapCells.forEach(function(cell) {

        var dateStr = this.getAttribute("data-heatmap-date");
        jumpToDate(dateStr);
      };

  // 处理日期输入跳转
  function handleDateJump(input) {
    var val = input.value.trim();
    if (!val) return;
    
    // 验证日期格式 YYYY-MM-DD
    var match = val.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (!match) {
      toast("请输入正确格式：YYYY-MM-DD");
      input.value = "";
      return;
    }
    
    var year = parseInt(match[1]);
    var month = parseInt(match[2]);
    var day = parseInt(match[3]);
    
    // 简单验证
    if (month < 1 || month > 12 || day < 1 || day > 31) {
      toast("日期无效");
      input.value = "";
      return;
    }
    
    var dateStr = year + "-" + String(month).padStart(2, '0') + "-" + String(day).padStart(2, '0');
    
    try {
      jumpToDate(dateStr);
    } catch(err) {
      console.error("日期跳转失败:", err);
      toast("跳转失败");
    }
    
    input.value = "";
  }
  
  // 日期跳转逻辑（独立函数，可复用）
  function jumpToDate(dateStr) {
    var selectedDate = new Date(dateStr + "T00:00:00");
    var now = new Date();
    var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    var selectedTime = selectedDate.getTime();
    var diffDays = Math.floor((todayStart - selectedTime) / 86400000);
    
    // 确定目标时间段
    var targetKey = "";
    if (diffDays === 0) targetKey = "today";
    else if (diffDays === 1) targetKey = "yesterday";
    else if (diffDays >= 2 && diffDays <= 7) targetKey = "thisWeek";
    else if (diffDays > 7 && selectedDate.getMonth() === now.getMonth()) targetKey = "thisMonth";
    else targetKey = "earlier";
    
    // 检查目标时间段是否存在
    var section = $("qnTimelineSection_" + targetKey);
    if (!section) {
      // 该时间段没有笔记
      var timeLabels = {
        today: "今天",
        yesterday: "昨天",
        thisWeek: "本周",
        thisMonth: "本月",
        earlier: "更早"
      };
      toast(timeLabels[targetKey] + "没有笔记");
      return;
    }
    
    // 展开目标时间段
    var items = $("qnTimelineItems_" + targetKey);
    var arrow = $("qnTimelineArrow_" + targetKey);
    if (items && arrow) {
      items.style.display = "";
      arrow.style.transform = "rotate(90deg)";
    }
    
    // 滚动到高亮
    setTimeout(function() {
      section.scrollIntoView({ behavior: "smooth", block: "start" });
      section.style.background = "rgba(91,107,232,0.05)";
      setTimeout(function() { section.style.background = ""; }, 1500);
    }, 100);
    
    toast("已跳转到 " + dateStr);
  }

  // 格式化周范围
  function fmtWeekRange(weekStart) {
    var d = new Date(weekStart);
    var end = new Date(weekStart + 6 * 86400000);
    return (d.getMonth() + 1) + "月" + d.getDate() + "日 - " + (end.getMonth() + 1) + "月" + end.getDate() + "日";
  }
  
  // 获取本月分类数
  function getMonthCatCount(notes) {
    var cats = {};
    notes.forEach(function(n) {
      var c = n.category || "未分类";
      cats[c] = true;
    });
    return Object.keys(cats).length;
  }
  
  // AI生成本周回顾总结
  function generateWeeklyReview() {
    if (!canChat) { toast("需要配置AI模型才能生成总结"); return; }
    
    var now = new Date();
    var weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay()).getTime();
    var weekNotes = store.notes.filter(function(n) {
      return new Date(n.updatedAt).getTime() >= weekStart;
    });
    
    if (!weekNotes.length) { toast("本周还没有笔记"); return; }
    
    setBusy(true, "AI 正在生成本周回顾...");
    
    // 构建AI提示词

      return "- [" + (n.category || "未分类") + "] " + titleOf(n) + ": " + (n.text || "").slice(0, 100);
    }).join("\n");
    
    var prompt = "你是一个思考助手。请根据用户本周的笔记记录，生成一份简洁的周回顾报告。\n\n本周笔记列表：\n" + noteSummaries + "\n\n请从以下维度总结（300-500字）：\n1. 本周主要关注的话题/领域\n2. 思维趋势或重复出现的主题\n3. 值得继续深入的方向\n4. 一个鼓励性的结语\n\n语气温暖、有洞察力，像朋友间的交流。";
    
    aiChat("你是一个温暖的思考伙伴，帮助用户回顾一周的思考历程。", prompt, { maxTokens: 2000 })
      .then(function(result) {
        setBusy(false);
        // aiChat() 返回的是纯文本字符串，不是对象
        if (result && typeof result === "string" && result.trim()) {
          showReviewSummary(result);
        } else {
          toast("AI 返回结果为空");
        }
      })
      .catch(function(err) {
        setBusy(false);
        toast("AI 生成失败: " + (err.message || err));

  function openEditor(noteId) {
    var n = noteId ? store.notes.filter(function (x) { return x.id === noteId; })[0] : null;
    store.editing = n ? JSON.parse(JSON.stringify(n)) : { id: "", title: "", text: "", category: "", tags: [], status: "inbox", aiSummary: "" };
    store.editingAttachments = n && Array.isArray(n.attachments) ? JSON.parse(JSON.stringify(n.attachments)) : [];
    store.analyzeAttachments = n && n.analyzeAttachments === true;
    // 附件懒加载：列表里的 attachments 只有元信息，打开编辑时按需取回完整 dataUrl
    var needLoad = !!(n && store.editingAttachments.length);
    store.editingAttachmentsLoaded = !needLoad; // 无附件视为已加载，可直接保存
    store.editingAttachmentsDirty = false;
    if (needLoad) {
      dbGet(COLL_NOTES, n.id).then(function (full) {
        if (!full || !Array.isArray(full.attachments)) { store.editingAttachmentsLoaded = true; return; }
        var byId = {};
        full.attachments.forEach(function (a, i) { byId[String(a.id || ("att_" + (a.uploadedAt || "") + "_" + i + "_" + (a.name || "")))] = a; });
        store.editingAttachments = store.editingAttachments.map(function (att) {
          var src = byId[att.id];
          if (src && src.dataUrl) { var c = {}; for (var k in att) c[k] = att[k]; c.dataUrl = src.dataUrl; return c; }
          return att;
        });
        store.editingAttachmentsLoaded = true;
        if ($("qnEditSheet").getAttribute("data-open") === "1") { renderAttachments(); updateAnalyzeToggle(); }
      });
    }
    $("qnEditTitle").textContent = n ? "编辑想法" : "新建想法";

    setStatusChips(store.editing.status || "inbox");
    var wrap = $("qnEditAiWrap");

    else wrap.style.display = "none";

    renderAttachments();
    updateAnalyzeToggle();

    renderLinks(); // 渲染双向链接
    $("qnEditSheet").setAttribute("data-open", "1");
  }

  /* ── 智能分类下拉菜单 ─ */
  var catDropdownVisible = false;

  function initCatDropdown() {
    var input = $("qnFCat");
    if (!input) return;

    // 移除旧的监听器（防止重复绑定）
    input.removeEventListener("input", handleCatInput);
    input.removeEventListener("focus", showCatDropdown);
    input.removeEventListener("blur", hideCatDropdownDelayed);
    input.removeEventListener("keydown", handleCatKeydown);

    // 添加新的监听器
    input.addEventListener("input", handleCatInput);
    input.addEventListener("focus", showCatDropdown);
    input.addEventListener("blur", hideCatDropdownDelayed);
    input.addEventListener("keydown", handleCatKeydown);
  }

  function getAllCategories() {
    // 从设置中获取 + 从已有笔记中提取
    var cats = store.cats.slice();
    store.notes.forEach(function(n) {
      if (n.category && cats.indexOf(n.category) < 0) {
        cats.push(n.category);
      }
    });
    return cats.sort();
  }

  function handleCatInput() {
    var value = this.value.trim().toLowerCase();
    if (value) {
      showCatDropdown.call(this);
    } else {
      hideCatDropdown();
    }
  }

  function showCatDropdown() {
    var input = $("qnFCat");
    var dropdown = $("qnCatDropdown");
    if (!input || !dropdown) return;

    var value = input.value.trim().toLowerCase();
    var allCats = getAllCategories();

    // 过滤匹配的分类
    var matched = allCats.filter(function(c) {
      return c.toLowerCase().indexOf(value) >= 0;
    });

    // 如果输入不为空且没有完全匹配，显示"新建"选项
    var showNewOption = value && allCats.indexOf(input.value.trim()) < 0;

    if (matched.length === 0 && !showNewOption) {
      hideCatDropdown();
      return;
    }

    // 渲染下拉菜单
    var html = matched.slice(0, 8).map(function(cat) {
      var highlighted = highlightMatch(cat, input.value.trim());
      var count = store.notes.filter(function(n) { return n.category === cat; }).length;
      return '<div class="qn-cat-item" data-cat="' + escapeHtml(cat) + '">' +
        '<span class="qn-cat-match">' + highlighted + '</span>' +
        '<span class="qn-cat-hint">' + count + ' 条</span>' +
        '</div>';
    }).join("");

    if (showNewOption) {
      html += '<div class="qn-cat-item new-cat" data-cat="' + escapeHtml(input.value.trim()) + '">' +
        escapeHtml(input.value.trim()) +
        '<span class="qn-cat-hint">新建分类</span>' +
        '</div>';
    }

    dropdown.innerHTML = html;
    dropdown.style.display = "block";
    catDropdownVisible = true;

    // 绑定点击事件
    dropdown.querySelectorAll(".qn-cat-item").forEach(function(item) {
      item.addEventListener("mousedown", function(e) {
        e.preventDefault(); // 防止 input blur
        var cat = this.getAttribute("data-cat");
        input.value = cat;
        hideCatDropdown();
      });
    });
  }

  function highlightMatch(text, query) {
    if (!query) return escapeHtml(text);
    var idx = text.toLowerCase().indexOf(query.toLowerCase());
    if (idx < 0) return escapeHtml(text);
    var before = text.substring(0, idx);
    var match = text.substring(idx, idx + query.length);
    var after = text.substring(idx + query.length);
    return escapeHtml(before) + '<strong>' + escapeHtml(match) + '</strong>' + escapeHtml(after);
  }
  function setStatusChips(val) {

  function handleFileUpload(files) {
    if (!files || !files.length) return;
    var remaining = Array.from(files).filter(function(file) {
      if (file.size > MAX_FILE_SIZE) {
        toast(file.name + " 超过 5MB，已跳过");
        return false;
      }
      var ext = '.' + (file.name.split('.').pop() || '').toLowerCase();
      if (!ALLOWED_TYPES[ext]) {
        toast(file.name + " 格式不支持，已跳过");
        return false;
      }
      return true;
    });

    if (!remaining.length) return;

    setEditorBusy(true, "读取文件中…");
    var promises = remaining.map(function(file) {
      return readFileAsBase64(file).then(function(dataUrl) {
        return {
          name: file.name,
          type: file.type || ALLOWED_TYPES['.' + file.name.split('.').pop().toLowerCase()] || 'application/octet-stream',
          size: file.size,
          dataUrl: dataUrl,
          uploadedAt: nowIso()
        };
      });
    });

    Promise.all(promises).then(function(newAttachments) {
      newAttachments.forEach(function(a){ a.id = uid("att"); });
      store.editingAttachments = (store.editingAttachments || []).concat(newAttachments);
      store.editingAttachmentsDirty = true;
      renderAttachments();
      updateAnalyzeToggle();
      toast("已添加 " + newAttachments.length + " 个附件");
    }).catch(function(err) {
      showNotice("文件读取失败", String(err && err.message ? err.message : err));
    }).then(function() {
      setEditorBusy(false);
    });
  }

  function removeAttachment(idx) {

    renderAttachments();

  function collectEditor() {
    store.editing.title = clampText($("qnFTitle").value.trim(), MAX_TITLE);
    store.editing.text = clampText($("qnFText").value, MAX_TEXT);
    var newCat = clampText($("qnFCat").value.trim(), 40);
    store.editing.category = newCat;
    
    // 如果输入了新分类且不在列表中，自动添加
    if (newCat && store.cats.indexOf(newCat) < 0) {
      store.cats.push(newCat);
      saveMeta(); // 保存到设置
    }
    
    store.editing.tags = parseTags($("qnFTags").value);
    store.editing.attachments = store.editingAttachments;
    store.editing.analyzeAttachments = store.analyzeAttachments;
    
    // 自动更新链接
    updateNoteLinks(store.editing);
    
    return store.editing;
  }
  function saveEditor() {
    var e = collectEditor();
    if (!e.text.trim() && !e.title.trim()) { toast("内容为空"); return; }
    var payload = {
      title: e.title, text: e.text, category: e.category, tags: e.tags,
      status: e.status, pinned: !!e.pinned, source: e.source || "app", aiSummary: e.aiSummary || "",
      analyzeAttachments: e.analyzeAttachments === true,
      updatedAt: nowIso()
    };
    // 附件懒加载写入策略：
    // - 新建：直接写入（上传的附件都带 dataUrl）
    // - 编辑且本次增删过附件：写入完整附件；但必须确保 dataUrl 都已加载，否则覆盖会丢数据
    // - 编辑且未动附件：不写 attachments 字段，靠 db.update 浅合并保留数据库里的原始完整附件
    if (!e.id) {
      payload.attachments = e.attachments || [];
    } else if (store.editingAttachmentsDirty) {
      if (!store.editingAttachmentsLoaded) { toast("附件加载中，请稍候再保存"); return; }
      var missingData = (e.attachments || []).some(function (a) { return !a.dataUrl; });
      if (missingData) { toast("附件数据未就绪，请重新打开该笔记后再保存"); return; }
      payload.attachments = e.attachments || [];
    }
    var p;
    if (e.id) p = dbUpdate(COLL_NOTES, e.id, payload).then(function () { return e.id; });
    else { payload.createdAt = nowIso(); p = dbCreate(COLL_NOTES, payload).then(function (row) { return (row && row.id) || payload.id; }); }
    p.then(function () { 
      closeSheets(); 
      return reloadNotes(); 
    }).then(function () { 
      toast("已保存"); 
    }).catch(function(err) {
      showNotice("保存失败", String(err && err.message ? err.message : err));
      console.error("[保存错误]", err);
    });
  }
  function deleteEditor() {

    askConfirm("删除这条想法？删除后无法恢复。", { danger: true, okText: "删除" }).then(function (ok) {
      if (!ok) return;
      dbDelete(COLL_NOTES, e.id).then(function () { closeSheets(); return reloadNotes(); }).then(function () { toast("已删除"); });

  // 提取文本中的关键词（简单分词）
  function extractKeywords(text) {
    if (!text) return [];
    // 移除标点符号和特殊字符
    var cleaned = text.replace(/[^\w\u4e00-\u9fff\s]/g, ' ');
    // 按空格和中文分词（简化处理）
    var words = cleaned.split(/[\s]+/).filter(function(w) { 
      return w.length >= 2 && !/^(的|了|是|在|有|和|与|及|等|这|那|什么|怎么|如何|可以|应该|需要|可能|因为|所以|但是|而且|或者|如果|虽然|已经|还是|只是|就是|一个|一些|这个|那个|这些|那些)$/.test(w); 
    });
    // 去重
    var unique = [];
    words.forEach(function(w) {
      if (unique.indexOf(w) < 0) unique.push(w);
    });
    return unique.slice(0, 30); // 最多30个关键词
  }
  
  // 计算两个笔记的相似度得分
  function calcSimilarity(noteA, noteB) {
    if (noteA.id === noteB.id) return 0; // 排除自己
    
    var score = 0;
    var reasons = [];
    
    // 1. 分类相同 (+30分)
    if (noteA.category && noteB.category && noteA.category === noteB.category) {
      score += 30;
      reasons.push("同分类: " + noteA.category);
    }
    
    // 2. 标签重叠 (+20分/个，最多60分)
    if (noteA.tags && noteB.tags) {
      var commonTags = noteA.tags.filter(function(t) { return noteB.tags.indexOf(t) >= 0; });
      if (commonTags.length) {
        var tagScore = Math.min(commonTags.length * 20, 60);
        score += tagScore;
        reasons.push("共同标签: " + commonTags.join(", "));
      }
    }
    
    // 3. 关键词重叠 (+5分/个，最多50分)
    var keywordsA = extractKeywords(noteA.text || "");
    var keywordsB = extractKeywords(noteB.text || "");
    if (keywordsA.length && keywordsB.length) {
      var commonWords = keywordsA.filter(function(w) { return keywordsB.indexOf(w) >= 0; });
      if (commonWords.length) {
        var wordScore = Math.min(commonWords.length * 5, 50);
        score += wordScore;
        reasons.push("内容相关: " + commonWords.slice(0, 3).join(", "));
      }
    }
    
    // 4. 链接关系 (+40分)
    if (noteA.links && noteA.links.indexOf(noteB.id) >= 0) {
      score += 40;
      reasons.push("直接引用");
    }
    if (noteB.links && noteB.links.indexOf(noteA.id) >= 0) {
      score += 40;
      reasons.push("被引用");
    }
    
    // 5. 共同引用的笔记 (+15分/个，最多30分)
    if (noteA.links && noteB.links) {
      var commonLinks = noteA.links.filter(function(id) { return noteB.links.indexOf(id) >= 0; });
      if (commonLinks.length) {
        var linkScore = Math.min(commonLinks.length * 15, 30);
        score += linkScore;
        reasons.push("共同引用 " + commonLinks.length + " 条笔记");
      }
    }
    
    // 6. 时间接近 (+10分，7天内)
    if (noteA.updatedAt && noteB.updatedAt) {
      var timeDiff = Math.abs(new Date(noteA.updatedAt).getTime() - new Date(noteB.updatedAt).getTime());
      if (timeDiff < 7 * 24 * 3600 * 1000) {
        score += 10;
        reasons.push("时间接近");
      }
    }
    
    return { score: score, reasons: reasons };
  }
  
  // 获取推荐笔记列表
  function getRecommendations(currentNote, limit) {
    limit = limit || 5;
    
    // 新笔记或没有内容的笔记不推荐
    if (!currentNote.id) return [];
    
    // 计算所有其他笔记的相似度
    var scored = store.notes.map(function(n) {
      var sim = calcSimilarity(currentNote, n);
      return { note: n, score: sim.score, reasons: sim.reasons };
    }).filter(function(item) {
      return item.score > 0; // 只保留有相似度的
    });
    
    // 如果相似度推荐的不够，补充同分类的笔记
    if (scored.length < 3 && currentNote.category) {
      var sameCatNotes = store.notes.filter(function(n) {
        return n.id !== currentNote.id && 
               n.category === currentNote.category &&
               !scored.some(function(s) { return s.note.id === n.id; });
      }).slice(0, 3 - scored.length);
      
      sameCatNotes.forEach(function(n) {
        scored.push({
          note: n,
          score: 15,
          reasons: ["同分类: " + currentNote.category]
        });
      });
    }
    
    // 按得分排序
    scored.sort(function(a, b) { return b.score - a.score; });
    
    // 返回前N个
    return scored.slice(0, limit);
  }

  function simpleMd(text) {
    var esc = escapeHtml(text || "");
    var lines = esc.split(/\n/);
    var out = [], inUl = false;
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      var h = ln.match(/^#{1,4}\s+(.*)$/) || ln.match(/^\*\*(.+)\*\*$/);
      var li = ln.match(/^\s*[-*]\s+(.*)$/);
      if (li) { if (!inUl) { out.push("<ul>"); inUl = true; } out.push("<li>" + li[1] + "</li>"); continue; }
      if (inUl) { out.push("</ul>"); inUl = false; }
      if (h) { out.push("<h4>" + h[1] + "</h4>"); continue; }
      if (!ln.trim()) { out.push(""); continue; }
      out.push("<p>" + ln + "</p>");
    }
    if (inUl) out.push("</ul>");
    return '<div class="qn-md">' + out.join("") + "</div>";
  }

  function formatDate(dateStr) {
    if (!dateStr) return "";
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return "";
    var year = d.getFullYear();
    var month = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    var hour = String(d.getHours()).padStart(2, '0');
    var minute = String(d.getMinutes()).padStart(2, '0');
    return year + "-" + month + "-" + day + " " + hour + ":" + minute;
  }

  function generateMarkdown(note) {
    var lines = [];
    lines.push("# " + (note.title || "无标题"));
    lines.push("");
    lines.push("**分类**: " + (note.category || "未分类"));
    lines.push("**标签**: " + (note.tags && note.tags.length ? note.tags.join(", ") : "无"));
    lines.push("**状态**: " + (note.status === "inbox" ? "收集箱" : note.status === "sorted" ? "已整理" : "归档"));
    lines.push("**创建时间**: " + formatDate(note.createdAt));
    lines.push("**更新时间**: " + formatDate(note.updatedAt));
    lines.push("");
    lines.push("---");
    lines.push("");
    lines.push(note.text || "");
    lines.push("");
    
    // AI总结
    if (note.aiSummary) {
      lines.push("---");
      lines.push("");
      lines.push("## 🤖 AI 总结");
      lines.push("");
      lines.push(note.aiSummary);
      lines.push("");
    }
    
    // 附件列表
    if (note.attachments && note.attachments.length) {
      lines.push("---");
      lines.push("");
      lines.push("## 📎 附件");
      lines.push("");
      note.attachments.forEach(function(att, i) {
        lines.push((i + 1) + ". **" + att.name + "** (" + formatFileSize(att.size) + ")");
      });
      lines.push("");
      lines.push("> 💡 提示：如需查看附件，请使用 ZIP 格式导出");

    return lines.join("\n");

  function downloadFile(content, filename, mimeType) {
    var blob = new Blob([content], { type: mimeType });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function() {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 100);
  }

  function exportNoteAsZip(note) {
    if (typeof JSZip === 'undefined') {
      toast("ZIP库加载失败，请检查网络连接");
      return;
    }
    
    setEditorBusy(true, "正在打包...");
    var zip = new JSZip();
    
    // 添加笔记文本文件（Markdown格式）
    var mdContent = generateMarkdown(note);
    zip.file((note.title || "笔记") + ".md", mdContent);
    
    // 添加附件文件夹
    if (note.attachments && note.attachments.length) {
      var attFolder = zip.folder("attachments");
      note.attachments.forEach(function(att) {
        try {
          if (!att.dataUrl) {
            console.error("[ZIP导出] 附件缺少dataUrl:", att.name);
            return;
          }
          
          // 从dataUrl提取base64数据
          var parts = att.dataUrl.split(',');
          if (parts.length < 2) {
            console.error("[ZIP导出] dataUrl格式错误:", att.name);
            return;
          }
          
          var base64Data = parts[1];
          attFolder.file(att.name, base64Data, { base64: true });
        } catch(e) {
          console.error("[ZIP导出] 附件打包失败:", att.name, e);
        }
      });
    }
    
    // 生成并下载zip
    zip.generateAsync({ type: "blob" }).then(function(content) {
      var filename = (note.title || "笔记") + ".zip";
      var url = URL.createObjectURL(content);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function() {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 100);
      setEditorBusy(false);
      closeSheets();
      toast("已导出: " + filename);
    }).catch(function(err) {
      setEditorBusy(false);
      toast("ZIP打包失败: " + err.message);
      console.error("[ZIP导出] 生成失败:", err);
    });
  }

  function doExport(format) {
    if (!exportNoteId) { toast("请先选择要导出的笔记"); return; }
    var note = store.notes.filter(function(n) { return n.id === exportNoteId; })[0];
    if (!note) { toast("笔记不存在"); return; }

    // ZIP / JSON 需要完整附件 dataUrl → 按需取回单条完整记录；MD / TXT 不含图片，用轻量数据即可
    var needsFull = (format === "zip" || format === "json") && note.attachments && note.attachments.length;
    function runExport(fullNote) {
      if (format === "zip") { exportNoteAsZip(fullNote); return; }
      var content, filename, mimeType;
      if (format === "md") {
        content = generateMarkdown(fullNote);
        filename = (fullNote.title || "笔记") + ".md";
        mimeType = "text/markdown;charset=utf-8";
      } else if (format === "txt") {
        content = generateTxt(fullNote);
        filename = (fullNote.title || "笔记") + ".txt";
        mimeType = "text/plain;charset=utf-8";
      } else if (format === "json") {
        content = generateJson(fullNote);
        filename = (fullNote.title || "笔记") + ".json";
        mimeType = "application/json;charset=utf-8";
      }
      downloadFile(content, filename, mimeType);
      closeSheets();
      toast("已导出: " + filename);
    }
    if (needsFull) {
      dbGet(COLL_NOTES, exportNoteId).then(function (full) { runExport(full || note); });
    } else {
      runExport(note);
    }
  }

  /* ══════════════════════════════════════════════════════
     7.5 批量操作
     ══════════════════════════════════════════════════════ */
  
  function toggleBatchMode() {
    store.batchMode = !store.batchMode;
    store.batchSelected = [];
    
    if (store.batchMode) {
      $("qnBatchBar").style.display = "";
      $("qnBatchSelectAll").checked = false;
      updateBatchCount();
    } else {
      $("qnBatchBar").style.display = "none";
    }
    
    renderList();
  }
  
  function bindBatchCheckboxes() {
    var checkboxes = document.querySelectorAll(".qn-card-checkbox");
    checkboxes.forEach(function(cb) {
      cb.addEventListener("change", function() {
        var noteId = this.getAttribute("data-note-id");
        if (this.checked) {
          if (store.batchSelected.indexOf(noteId) < 0) {
            store.batchSelected.push(noteId);
          }
        } else {
          var idx = store.batchSelected.indexOf(noteId);
          if (idx >= 0) store.batchSelected.splice(idx, 1);
        }
        updateBatchCount();
        updateSelectAllState();
      });
    });
  }
  
  function updateBatchCount() {
    $("qnBatchCount").textContent = "已选 " + store.batchSelected.length + " 条";
  }
  
  function updateSelectAllState() {
    var visibleNotes = filteredNotes();
    $("qnBatchSelectAll").checked = visibleNotes.length > 0 && store.batchSelected.length === visibleNotes.length;
  }
  
  function exportBatchAsZip() {
    if (!store.batchSelected.length) {
      toast("请先选择要导出的笔记");
      return;
    }
    
    if (typeof JSZip === 'undefined') {
      toast("ZIP库加载失败，请检查网络连接");
      return;
    }
    
    setBusy(true, "正在读取笔记数据…");

    // 附件懒加载：批量导出前按需取回每条笔记的完整数据（含 dataUrl）
    var ids = store.batchSelected.slice();
    Promise.all(ids.map(function (id) {
      return dbGet(COLL_NOTES, id).then(function (full) {
        // 直接用原始完整记录（含 dataUrl）；不能用 normalizeNote，它会剥离 dataUrl 导致图片丢失
        if (full) return full;
        return store.notes.filter(function (n) { return n.id === id; })[0] || null;
      });
    })).then(function (loaded) {
      var selectedNotes = loaded.filter(Boolean);
      // 按更新时间排序，最新的在前
      selectedNotes.sort(function (a, b) {
        return String(b.updatedAt).localeCompare(String(a.updatedAt));
      });

      var zip = new JSZip();
      var notesFolder = zip.folder("随想笔记_批量导出_" + new Date().toISOString().slice(0, 10));

      selectedNotes.forEach(function (note, index) {
        var num = String(index + 1).padStart(2, '0');
        var title = note.title ? note.title.trim() : "";
        var folderName = (num + "_" + (title || "无标题")).replace(/[\/\\:*?"<>|]/g, '_');
        var noteFolder = notesFolder.folder(folderName);

        // 添加Markdown文件
        noteFolder.file((title || "无标题") + ".md", generateMarkdown(note));

        // 添加附件（保持结构一致）
        if (note.attachments && note.attachments.length) {
          var attFolder = noteFolder.folder("attachments");
          note.attachments.forEach(function (att) {
            try {
              if (att.dataUrl) {
                var parts = att.dataUrl.split(',');
                if (parts.length >= 2) attFolder.file(att.name, parts[1], { base64: true });
              }
            } catch (e) {
              console.error("附件打包失败:", att.name, e);
            }
          });
        }
      });

      setBusy(true, "正在打包 " + selectedNotes.length + " 条笔记...");
      return zip.generateAsync({ type: "blob" }).then(function (content) {
        var filename = "随想笔记_批量导出_" + new Date().toISOString().slice(0, 10) + ".zip";
        var url = URL.createObjectURL(content);
        var a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 100);
        setBusy(false);
        toggleBatchMode();
        toast("已导出 " + selectedNotes.length + " 条笔记");
      });
    }).catch(function (err) {
      setBusy(false);
      toast("ZIP打包失败: " + (err && err.message ? err.message : err));
      console.error("[批量导出] 生成失败:", err);
    });
  }

  /* ═════════════════════════════════════════════════════
     8. 设置
     ══════════════════════════════════════════════════════ */
  /* ══════════════════════════════════════════════════════
     9. 事件绑定
     ══════════════════════════════════════════════════════ */
  function closeSheets() {
    ["qnEditSheet", "qnCharSheet", "qnAnaSheet", "qnExportSheet"].forEach(function (id) { $(id).setAttribute("data-open", "0"); });
  }

  function bind() {
    // 列表点击
    $("qnList").addEventListener("click", function (e) {
      var card = e.target.closest ? e.target.closest("[data-open-note]") : null;
      if (card) { openEditor(card.getAttribute("data-open-note")); return; }
      var ana = e.target.closest ? e.target.closest("[data-open-ana]") : null;
      if (ana) { openAna(ana.getAttribute("data-open-ana")); return; }
    });
    // 分类 chips
    $("qnChips").addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest("[data-cat]") : null;
      if (!b) return;
      var val = b.getAttribute("data-cat");
      store.cat = (store.cat === val) ? "" : val;
      renderChips(); renderList();
    });
    // 搜索 / 排序 / tab
    $("qnSearch").addEventListener("input", function () { store.q = this.value; renderList(); });
    $("qnSort").addEventListener("change", function () { store.sort = this.value; renderList(); });
    $("qnTabNotes").addEventListener("click", function () { store.view = "notes"; renderAll(); });
    $("qnTabTimeline").addEventListener("click", function () { store.view = "timeline"; renderAll(); });
    $("qnTabReview").addEventListener("click", function () { store.view = "review"; renderAll(); });
    $("qnTabAnas").addEventListener("click", function () { store.view = "anas"; renderAll(); });
    
    // 时间线分组切换 + 折叠控制 + 日期跳转（事件委托）
    $("qnList").addEventListener("click", function (e) {
      var target = e.target;
      
      // 分组方式切换
      if (target.id === "qnTimelineByUpdated") {
        store.timelineGroupBy = "updated";
        renderTimeline();
      } else if (target.id === "qnTimelineByCreated") {
        store.timelineGroupBy = "created";
        renderTimeline();
      }
      
      // 全部展开/收起
      else if (target.id === "qnTimelineToggleAll") {
        var sections = document.querySelectorAll("[data-toggle-section]");
        var allOpen = true;
        sections.forEach(function(sec) {
          var key = sec.getAttribute("data-toggle-section");
          var items = $("qnTimelineItems_" + key);
          if (items && items.style.display === "none") allOpen = false;
        });
        
        // 切换所有时间段
        var timeKeys = ["today", "yesterday", "thisWeek", "thisMonth", "earlier"];
        timeKeys.forEach(function(key) {
          var items = $("qnTimelineItems_" + key);
          var arrow = $("qnTimelineArrow_" + key);
          if (!items || !arrow) return;
          
          if (allOpen) {
            items.style.display = "none";
            arrow.style.transform = "rotate(0deg)";
          } else {
            items.style.display = "";
            arrow.style.transform = "rotate(90deg)";
          }
        });
        
        target.textContent = allOpen ? "展开" : "收起";
      }
      
      // 单个时间段折叠/展开
      else if (target.hasAttribute && target.hasAttribute("data-toggle-section")) {
        var key = target.getAttribute("data-toggle-section");
        var items = $("qnTimelineItems_" + key);
        var arrow = $("qnTimelineArrow_" + key);
        if (!items || !arrow) return;
        
        if (items.style.display === "none") {
          items.style.display = "";
          arrow.style.transform = "rotate(90deg)";
        } else {
          items.style.display = "none";
          arrow.style.transform = "rotate(0deg)";
        }
      }
    });
    
    // 回顾AI总结按钮（事件委托到body）
    document.body.addEventListener("click", function(e) {
      if (e.target.id === "qnReviewAiSummary") {
        generateWeeklyReview();
      }
    });
    
    $("qnNew").addEventListener("click", function () { openEditor(""); });
    $("qnRefresh").addEventListener("click", function () {
      var p = store.view === "anas" ? reloadAnas() : reloadNotes();
      Promise.resolve(p).then(function () { toast("已刷新"); });
    });
    $("qnAiAll").addEventListener("click", function () {
      // 优先「问角色」批量点评；若没角色则退化为逐条 AI 整理
      var inbox = store.notes.filter(function (n) { return n.status === "inbox"; });
      if (store.chars.length) {
        askConfirm("对收集箱的 " + inbox.length + " 条想法做点什么？\n\n· 让角色点评 = 选中角色读一遍并给建议\n· 逐条 AI 整理 = 自动归类打标签写摘要", { okText: "让角色点评" }).then(function (ok) {
          if (ok) {
            if (!inbox.length) { toast("收集箱是空的"); return; }
            openCharPicker({ mode: "inbox", notes: inbox });
          } else {
            askConfirm("改为逐条 AI 整理？", { okText: "整理" }).then(function (yes) { if (yes) aiOrganizeAll(); });
          }
        });
      } else {
        aiOrganizeAll();
      }
    });

    // 编辑面板
    $("qnFStatus").addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest("[data-val]") : null;
      if (b) setStatusChips(b.getAttribute("data-val"));
    });
    $("qnFileInput").addEventListener("change", function () {
      handleFileUpload(this.files);
      this.value = ""; // 清空以便重新选择同一文件
    });
    $("qnAttachList").addEventListener("click", function (e) {
      var delBtn = e.target.closest ? e.target.closest("[data-del-idx]") : null;
      if (delBtn) removeAttachment(parseInt(delBtn.getAttribute("data-del-idx")));
    });
    $("qnEditUseTpl").addEventListener("click", function () { openTemplatePicker(); });
    $("qnEditExport").addEventListener("click", function () { 
      var e = collectEditor();
      if (!e.id) { toast("请先保存笔记后再导出"); return; }
      openExport(e.id); 
    });
    $("qnEditSave").addEventListener("click", saveEditor);
    $("qnEditDel").addEventListener("click", deleteEditor);
    $("qnEditAi").addEventListener("click", runOrganizeInEditor);
    $("qnEditAsk").addEventListener("click", function () {
      var e = collectEditor();
      if (!e.text.trim() && !e.title.trim()) { toast("先写点内容"); return; }
      openCharPicker({ mode: "single", notes: [e] });
    });

    // 选角色
    $("qnCharList").addEventListener("click", function (e) {
      var c = e.target.closest ? e.target.closest("[data-char]") : null;
      if (c) runAskCharacter(c.getAttribute("data-char"));
    });

    // 分析面板
    $("qnAnaCopy").addEventListener("click", function () { if (store.lastAna) copyText(store.lastAna.text); });
    $("qnAnaChat").addEventListener("click", sendAnaToChat);
    $("qnAnaDel").addEventListener("click", function () {
      var a = store.lastAna; if (!a) return;
      askConfirm("删除这篇分析？", { danger: true, okText: "删除" }).then(function (ok) {
        if (!ok) return;
        dbDelete(COLL_ANAS, a.id).then(function () { closeSheets(); return reloadAnas(); }).then(function () { toast("已删除"); });
      });
    });

    // 导出格式选择
    $("qnExportMd").addEventListener("click", function () { doExport("md"); });
    $("qnExportTxt").addEventListener("click", function () { doExport("txt"); });
    $("qnExportJson").addEventListener("click", function () { doExport("json"); });
    $("qnExportZip").addEventListener("click", function () { doExport("zip"); });

    // 模板选择器
    $("qnNewTpl").addEventListener("click", function () { openTemplatePicker(); });
    
    // 批量操作按钮
    $("qnBatchToggle").addEventListener("click", function() {
      toggleBatchMode();
    });
    
    // 批量操作栏事件
    $("qnBatchSelectAll").addEventListener("change", function() {
      var visibleNotes = filteredNotes();
      if (this.checked) {
        store.batchSelected = visibleNotes.map(function(n) { return n.id; });
      } else {
        store.batchSelected = [];
      }
      renderList();
      updateBatchCount();
    });
    
    $("qnBatchExport").addEventListener("click", function() {
      exportBatchAsZip();
    });
    
    $("qnBatchCancel").addEventListener("click", function() {
      toggleBatchMode();
    });
    
    // 模板操作按钮
    document.addEventListener("click", function (e) {
      // 复制提示词
      if (e.target.closest && e.target.closest("#qnTplCopyPrompt")) {
        copyTemplatePrompt();
        return;
      }
      
      // 应用预设模板
      var tplBtn = e.target.closest ? e.target.closest("[data-apply-tpl]") : null;
      if (tplBtn) {
        var tplId = tplBtn.getAttribute("data-apply-tpl");
        var tpl = BUILTIN_TEMPLATES.filter(function(t) { return t.id === tplId; })[0];
        if (tpl) applyTemplate(tpl);
        return;
      }
      
      // 应用自定义模板
      var customTplBtn = e.target.closest ? e.target.closest("[data-apply-custom-tpl]") : null;
      if (customTplBtn) {
        var idx = parseInt(customTplBtn.getAttribute("data-apply-custom-tpl"));
        var tpl = store.customTemplates[idx];
        if (tpl) applyTemplate(tpl);
        return;
      }
    });
    
    // JSON模板导入
    $("qnTplFileInput").addEventListener("change", function () {
      if (this.files && this.files.length) {
        importJsonTemplate(this.files[0]);
        this.value = "";
      }
    });
    
    // 解析粘贴的JSON
    $("qnTplParseJson").addEventListener("click", parsePastedJson);
    
    // 手动创建模板引导
    $("qnTplManualGuide").addEventListener("click", showManualGuide);
    
    // 插入链接按钮
    $("qnInsertLink").addEventListener("click", openLinkPicker);
    
    // 链接搜索
    $("qnLinkSearch").addEventListener("input", function() {
      renderLinkPickerList(this.value);
    });
    
    // 选择链接
    document.addEventListener("click", function(e) {
      var linkItem = e.target.closest ? e.target.closest("[data-pick-link]") : null;
      if (linkItem) {
        var id = linkItem.getAttribute("data-pick-link");
        insertLinkToNote(id);
      }
    });

    // 弹窗
    $("qnDialogOk").addEventListener("click", function () { _closeDialog(true); });
    $("qnDialogCancel").addEventListener("click", function () { _closeDialog(false); });
    $("qnDialog").querySelector(".qn-dialog-mask").addEventListener("click", function () { _closeDialog(false); });

    // 抽屉关闭
    document.addEventListener("click", function (e) {
      var x = e.target.closest ? e.target.closest("[data-close]") : null;
      if (x) closeSheets();
    });

    // 从宿主同步：宿主速记小窗写入后广播的事件（若宿主支持）
    if (AI && AI.on) {
      try { AI.on("app.data.changed", function () { reloadNotes(); }); } catch (e) {}
    }
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") { reloadNotes(); }
    });
  }

  /* ══════════════════════════════════════════════════════
     9. 启动
     ══════════════════════════════════════════════════════ */
  function boot() {
    bind();
    if (!canDb) {
      $("qnList").innerHTML = '<div class="qn-empty"><b>存储不可用</b>当前环境没有可用的数据接口（app.data.read/write）。</div>';
      renderTabs();
      return;
    }
    setBusy(true, "加载中…");
    loadAll().then(function () {
      store.view = "notes";
      setBusy(false);
      renderAll();
    }).catch(function (err) {
      setBusy(false);
      $("qnList").innerHTML = '<div class="qn-empty">加载失败：' + escapeHtml(String(err && err.message ? err.message : err)) + "</div>";
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
